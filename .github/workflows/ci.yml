name: Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ro-assist-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc-c++ \
            cmake \
            ninja-build \
            qt6-qtbase-devel \
            qt6-qttools-devel \
            desktop-file-utils \
            appstream

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Run tests
        run: ctest --preset ci

      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/ro-assist.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate packaging/linux/io.github.project_ro_asd.ro_assist.metainfo.xml

  ro-app-gate:
    name: ro-app-gate
    if: ${{ always() }}
    needs: [build-and-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce final application gate
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
        run: |
          set -euo pipefail
          [[ "${BUILD_RESULT}" == "success" ]]
