name: Build RPM Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: rpm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rpm:
    name: ro-assist-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc-c++ \
            git \
            cmake \
            ninja-build \
            rpm-build \
            createrepo_c \
            desktop-file-utils \
            appstream \
            qt6-qtbase-devel \
            qt6-qttools-devel

      - name: Build package
        run: |
          cmake --preset ci
          cmake --build --preset ci
          ctest --preset ci
          desktop-file-validate packaging/linux/ro-assist.desktop
          appstreamcli validate packaging/linux/io.github.project_ro_asd.ro_assist.metainfo.xml
          version="$(awk '/^project\(ro-assist VERSION / { print $3; exit }' CMakeLists.txt)"
          spec_version="$(awk '/^Version:/ { print $2; exit }' packaging/rpm/ro-assist.spec)"
          metadata_version="$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' packaging/linux/io.github.project_ro_asd.ro_assist.metainfo.xml | head -n 1)"
          test "$version" = "$spec_version"
          test "$version" = "$metadata_version"

          topdir="$HOME/rpmbuild"
          mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS} build/ninja/packages
          stage_dir="$(mktemp -d)"
          mkdir -p "$stage_dir/ro-assist-${version}"
          tar --exclude-vcs --exclude='./build' -cf - . | \
            tar -C "$stage_dir/ro-assist-${version}" -xf -
          tar -C "$stage_dir" -czf \
            "$topdir/SOURCES/ro-assist-${version}.tar.gz" \
            "ro-assist-${version}"
          rm -rf "$stage_dir"
          cp packaging/rpm/ro-assist.spec "$topdir/SPECS/"
          rpmbuild -ba --define "_topdir $topdir" --define "dist .fc44" \
            "$topdir/SPECS/ro-assist.spec"
          find "$topdir/RPMS" -type f -name '*.rpm' -exec cp -v {} build/ninja/packages/ \;
          if [ "${{ matrix.arch }}" = x64 ]; then
            cp -v "$topdir"/SRPMS/*.src.rpm build/ninja/packages/
          fi

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: ro-assist-${{ matrix.arch }}
          path: build/ninja/packages/*.rpm
          if-no-files-found: error

  validate-rpm:
    name: validate-ro-assist-${{ matrix.arch }}
    needs: build-rpm
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install validation dependencies
        run: |
          dnf install -y \
            createrepo_c \
            rpm-build \
            qt6-qtbase

      - name: Download RPM artifact
        uses: actions/download-artifact@v8
        with:
          name: ro-assist-${{ matrix.arch }}
          path: artifact-rpm

      - name: Validate Fedora 44 RPM install path
        run: |
          rpm_path="$(find artifact-rpm -maxdepth 1 -type f -name '*.rpm' ! -name '*.src.rpm' | head -n 1)"
          test -n "$rpm_path"
          packaging/scripts/validate-fedora-rpm.sh "$rpm_path"
